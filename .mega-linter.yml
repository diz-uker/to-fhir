# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/configuration/ and in linters documentation

APPLY_FIXES: none # all, none, or list of linter keys
# ENABLE: # If you use ENABLE variable, all other languages/formats/tooling-formats will be disabled by default
# ENABLE_LINTERS: # If you use ENABLE_LINTERS variable, all other linters will be disabled by default
DISABLE:
  - COPYPASTE # Uncomment to disable checks of excessive copy-pastes
  - SPELL # Uncomment to disable checks of spelling mistakes
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
# DISABLE_ERRORS: true # Uncomment if you want MegaLinter to detect errors but not block CI to pass

DISABLE_LINTERS:
  - JAVA_PMD
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - REPOSITORY_DEVSKIM
  - CSHARP_ROSLYNATOR
  - CSHARP_DOTNET_FORMAT
  - PYTHON_BLACK
  - PYTHON_PYRIGHT
  - PYTHON_PYLINT
  # Redundant with PYTHON_RUFF's "I" (isort) rule set, which is correctly configured for this
  # repo's src layout and line length; the standalone tool has no such config and reformats every
  # new file to its own unrelated defaults.
  - PYTHON_ISORT

GROOVY_NPM_GROOVY_LINT_ARGUMENTS:
  - "--failon=warning"

JAVA_CHECKSTYLE_CONFIG_FILE: .checkstyle/checkstyle.xml

# gradlew is a vendored wrapper script regenerated by `./gradlew wrapper`; never hand-formatted.
BASH_SHFMT_FILTER_REGEX_EXCLUDE: "gradlew"

# CHANGELOG.md is release-please-managed; its repeated "Features"/"Bug Fixes" headings per version
# section are structural, not fixable without breaking the generator's format.
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: "CHANGELOG.md"

PYTHON_BANDIT_FILTER_REGEX_EXCLUDE: "(fhir-ig-constants-py/src/|ig-codegen-py/tests/|to-fhir-py/tests/)"
PYTHON_FLAKE8_FILTER_REGEX_EXCLUDE: "fhir-ig-constants-py/src/"
PYTHON_RUFF_FILTER_REGEX_EXCLUDE: "fhir-ig-constants-py/src/"
# mypy identifies each file by its top-level package name; ig-codegen-py/tests and
# to-fhir-py/tests both resolve to a bare "tests" module and collide when scanned together
# (--explicit-package-bases does not help here: mypy still treats same-named packages passed as
# explicit file args as one module regardless of their differing base dirs). Test code is covered
# by pytest itself; scope mypy to the shipped library code, like PYTHON_BANDIT already does.
PYTHON_MYPY_FILTER_REGEX_EXCLUDE: "(ig-codegen-py/tests/|to-fhir-py/tests/)"

# syrupy's snapshot(name=...) API names multi-snapshot-per-test files "test_id[name].json" by
# design (see https://github.com/syrupy-project/syrupy); v8r's glob-based file argument parsing
# then misreads the brackets as a character class and reports "did not match any files" even
# though the JSON itself is valid (JSON_JSONLINT already validates it). Renaming away from
# syrupy's own convention isn't the right fix, so exclude the snapshot fixtures instead.
JSON_V8R_FILTER_REGEX_EXCLUDE: "to-fhir-py/tests/__snapshots__/"
