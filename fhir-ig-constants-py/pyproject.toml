[project]
name = "fhir-ig-constants"
version = "0.2.18"  # x-release-please-version
description = "Generated Python constant classes for the canonical URLs of a set of FHIR Implementation Guides, via ig-codegen."
requires-python = ">=3.12"
dependencies = [
    "fhir.resources>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Generated modules live under src/de/...; ship the top-level namespace package.
packages = ["src/de"]

# FHIR URLs and concept display strings can exceed 100 characters; E741 applies to single-letter
# FHIR codes used as enum member names. Both are intentional in generated code.
[tool.ruff]
line-length = 200

[tool.ruff.lint]
ignore = ["E741"]

# Manually-invoked "generate, review, commit" dev tool — not a build-graph participant.
# Run with:
#   cd ../ig-codegen-py && uv run ig-codegen \
#     ../fhir-ig-constants/package.json ../fhir-ig-constants/node_modules \
#     ../fhir-ig-constants-py/src/
#   uv run ruff format src/
