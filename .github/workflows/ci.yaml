name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  release:
    types: [created]
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  java-build:
    name: Java build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build with Gradle
        run: |
          ./gradlew build

      - name: Run Tests
        run: ./gradlew test

      - name: Run Test Coverage
        run: ./gradlew jacocoTestReport

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libs
          path: |
            to-fhir/build/libs/
            to-fhir-starter/build/libs/

  maven-central-publish:
    name: maven-central-publish
    needs: java-build
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    runs-on: ubuntu-24.04
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.diz-uker/to-fhir/versions
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Publish to central
        run: |
          ./gradlew publish --no-configuration-cache
          ./gradlew publishToMavenCentralPortal --no-configuration-cache
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}

      - name: Attest Java artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            to-fhir/build/libs/*.jar
            to-fhir-starter/build/libs/*.jar
            fhir-ig-constants/build/libs/*.jar
            ig-codegen/build/libs/*.jar

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" libs.intoto.jsonl
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            to-fhir/build/libs/*.jar \
            to-fhir-starter/build/libs/*.jar \
            fhir-ig-constants/build/libs/*.jar \
            ig-codegen/build/libs/*.jar \
            libs.intoto.jsonl

  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Test
        run: |
          dotnet test ig-codegen-cs/IgCodegen.Tests/ --configuration Release
          dotnet test to-fhir-cs/ToFhir.Tests/ --configuration Release

      - name: Format
        run: |
          dotnet csharpier format .
          git diff --exit-code -- "*.cs"

      - name: Pack
        run: |
          dotnet pack ig-codegen-cs/IgCodegen.Core/IgCodegen.Core.csproj --configuration Release --output artifacts/
          dotnet pack ig-codegen-cs/IgCodegen/IgCodegen.csproj --configuration Release --output artifacts/
          dotnet pack fhir-ig-constants-cs/fhir-ig-constants-cs.csproj --configuration Release --output artifacts/
          dotnet pack to-fhir-cs/ToFhir/ToFhir.csproj --configuration Release --output artifacts/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: artifacts/

  nuget-publish:
    name: nuget-publish
    needs: dotnet
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    runs-on: ubuntu-24.04
    environment:
      name: nuget
      url: https://www.nuget.org/packages/DizUker.ToFhir
    permissions:
      contents: write
      attestations: write
      # to request the OIDC token used for NuGet Trusted Publishing and for attestation signing
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: artifacts/

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Attest NuGet packages
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.nupkg

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" nuget-packages.intoto.jsonl
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            artifacts/*.nupkg \
            nuget-packages.intoto.jsonl

  python:
    name: python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Test ig-codegen-py
        working-directory: ig-codegen-py
        run: uv run pytest

      - name: Lint ig-codegen-py
        working-directory: ig-codegen-py
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Test to-fhir-py
        working-directory: to-fhir-py
        run: uv run pytest

      - name: Lint to-fhir-py
        working-directory: to-fhir-py
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Build fhir-ig-constants-py
        working-directory: fhir-ig-constants-py
        run: uv build

      - name: Upload fhir-ig-constants-py dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fhir-ig-constants-py-dist
          path: fhir-ig-constants-py/dist/

      - name: Build to-fhir-py
        working-directory: to-fhir-py
        run: uv build

      - name: Upload to-fhir-py dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: to-fhir-py-dist
          path: to-fhir-py/dist/

  python-publish:
    name: python-publish
    needs: python
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/fhir-ig-constants/
    permissions:
      contents: write
      attestations: write
      id-token: write # for PyPI Trusted Publishing on release
    steps:
      - name: Download fhir-ig-constants-py dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fhir-ig-constants-py-dist
          path: fhir-ig-constants-py/dist/

      - name: Publish fhir-ig-constants-py to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: fhir-ig-constants-py/dist/

      - name: Attest fhir-ig-constants-py artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: fhir-ig-constants-py/dist/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" fhir-ig-constants-py-dist.intoto.jsonl
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            fhir-ig-constants-py/dist/* \
            fhir-ig-constants-py-dist.intoto.jsonl

  to-fhir-py-publish:
    name: to-fhir-py-publish
    needs: python
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/to-fhir/
    permissions:
      contents: write
      attestations: write
      id-token: write # for PyPI Trusted Publishing on release
    steps:
      - name: Download to-fhir-py dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: to-fhir-py-dist
          path: to-fhir-py/dist/

      - name: Publish to-fhir-py to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: to-fhir-py/dist/

      - name: Attest to-fhir-py artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: to-fhir-py/dist/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" to-fhir-py-dist.intoto.jsonl
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            to-fhir-py/dist/* \
            to-fhir-py-dist.intoto.jsonl

  lint:
    uses: miracum/.github/.github/workflows/standard-lint.yaml@602a4dd955cee8ab1e7e9c70761b5b4c9d678a95 # v1.21.4
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    with:
      enable-validate-gradle-wrapper: true
      codeql-languages: '["java", "csharp"]'
      enable-codeql: true
      enable-verify-base-image-signature: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
