name: FHIR IG constants

on:
  pull_request:
    branches: [master]
    paths:
      - "fhir-ig-constants/package.json"
      - "ig-codegen/src/main/java/**"
      - "ig-codegen-cs/**"
  push:
    branches: [master]
    paths:
      - "fhir-ig-constants/package.json"
      - "ig-codegen/src/main/java/**"
      - "ig-codegen-cs/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-generated-code:
    name: check generated code is up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          set-safe-directory: true

      # restore the fhir packages once per workflow run here to avoid multiple
      # jobs running in parallel each restoring at the same time
      - name: Cache FHIR packages
        id: fhir-package-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            fhir-ig-constants/node_modules
          key: fhir-packages-${{ hashFiles('fhir-ig-constants/package.json') }}
          restore-keys: |
            fhir-packages-

      - name: Restore FHIR package dependencies
        if: ${{ steps.fhir-package-cache.outputs.cache-hit != 'true' }}
        working-directory: fhir-ig-constants
        run: |
          npm install --no-audit --no-fund --no-package-lock --ignore-scripts

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.x"

      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Regenerate Java FHIR IG constants
        run: ./gradlew :fhir-ig-constants:generateIgConstants

      - name: Fail if Java generated code is out of date
        run: |
          if ! git diff --exit-code -- fhir-ig-constants/src/main/java; then
            echo "::error::Generated Java FHIR IG constants are out of date. Run './gradlew :fhir-ig-constants:generateIgConstants' locally, review the diff, and commit the result."
            exit 1
          fi

      - name: Regenerate C# FHIR IG constants
        run: |
          dotnet run --project ig-codegen-cs/IgCodegen/IgCodegen.csproj --configuration Release -- \
            fhir-ig-constants/package.json \
            fhir-ig-constants/node_modules \
            fhir-ig-constants-cs/src/

      - name: Fail if C# generated code is out of date
        run: |
          if ! git diff --exit-code -- fhir-ig-constants-cs/src/; then
            echo "::error::Generated C# FHIR IG constants are out of date. Run 'cd fhir-ig-constants && npm install && cd .. && dotnet msbuild fhir-ig-constants-cs -t:GenerateIgConstants' locally, review the diff, and commit the result."
            exit 1
          fi
